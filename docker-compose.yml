services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdfbox-backend
    ports:
      - "8080:8080"
    networks:
      - pdfapp_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:

      - "3000:80"
    networks:
      - pdfapp_net

networks:
  pdfapp_net:
    driver: bridge